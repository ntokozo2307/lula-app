<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lula — Smart Business App</title>
  <link rel="stylesheet" href="style.css" />
  <!--
    ════════════════════════════════════════════════════
    GOOGLE SIGN-IN SETUP
    1. Go to https://console.cloud.google.com/
    2. Create a project → APIs & Services → Credentials
    3. Create OAuth 2.0 Client ID (Web application)
    4. Add your GitHub Pages URL to "Authorised JavaScript origins"
       e.g. https://yourusername.github.io
    5. Copy your Client ID and paste it below where it says:
       790839446499-2q8ir0ttrcs7jf3v00uls48bc3m3q3s2.apps.googleusercontent.com
    ════════════════════════════════════════════════════
  -->
  <meta name="google-signin-client_id" content="790839446499-2q8ir0ttrcs7jf3v00uls48bc3m3q3s2.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="login-page">
  <div class="login-box">

    <div class="login-logo">
      <div class="brand-mark">Lu<span>la</span></div>
      <div class="login-tagline">Smart business tools for South African shops</div>
    </div>

    <!-- Google One Tap Sign-In -->
    <div
      id="g_id_onload"
      data-client_id="790839446499-2q8ir0ttrcs7jf3v00uls48bc3m3q3s2.apps.googleusercontent.com"
      data-callback="handleGoogleSignIn"
      data-auto_prompt="false">
    </div>

    <!-- Continue with Google button -->
    <button class="btn-google" onclick="triggerGoogleSignIn()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <!-- Email/password fallback -->
    <div class="input-group">
      <label>Phone number or email</label>
      <input type="text" placeholder="e.g. 0821234567 or mama@spaza.co.za" />
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" placeholder="Enter your password" />
    </div>

    <button class="btn btn-primary btn-full" onclick="window.location.href='setup.html'">
      Sign in
    </button>

    <p style="text-align:center; margin-top:18px; font-size:13px; color:var(--muted);">
      Don't have an account?
      <a href="setup.html" style="color:var(--green); font-weight:500;">Get started free →</a>
    </p>

    <!-- Feature highlights -->
    <div style="margin-top:32px; padding-top:24px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted);">
        <span style="font-size:16px;">📶</span> Works without internet — syncs when back online
      </div>
      <div style="display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted);">
        <span style="font-size:16px;">💰</span> 80% less data — built for expensive South African data
      </div>
      <div style="display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted);">
        <span style="font-size:16px;">🏪</span> Built for spaza shops, taverns, salons & more
      </div>
    </div>
  </div>
</div>

<script>
  // ── Google Sign-In Handler ──
  function handleGoogleSignIn(response) {
    // response.credential is the JWT token from Google
    // In production: send this token to your Supabase backend to verify
    console.log('Google sign-in successful', response);

    // For now: decode the JWT to get user info and store locally
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    localStorage.setItem('lula_user', JSON.stringify({
      name:    payload.name,
      email:   payload.email,
      picture: payload.picture,
      loginMethod: 'google'
    }));

    // Redirect to setup if new user, otherwise dashboard
    const hasSetup = localStorage.getItem('lula_setup_done');
    window.location.href = hasSetup ? 'dashboard.html' : 'setup.html';
  }

  function triggerGoogleSignIn() {
    if (typeof google !== 'undefined' && google.accounts) {
      google.accounts.id.prompt();
    } else {
      // Google SDK not loaded (no Client ID set yet) — show helpful message
      alert(
        'Google Sign-In is not configured yet.\n\n' +
        'To enable it:\n' +
        '1. Get a Google Client ID from console.cloud.google.com\n' +
        '2. Replace 790839446499-2q8ir0ttrcs7jf3v00uls48bc3m3q3s2.apps.googleusercontent.com in index.html\n\n' +
        'For now, use the email/password fields or go to setup.html directly.'
      );
    }
  }

  // If already logged in, skip to dashboard
  if (localStorage.getItem('lula_user') && localStorage.getItem('lula_setup_done')) {
    window.location.href = 'dashboard.html';
  }
</script>

</body>
</html>
