<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lula — Smart Business App</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="login-page">
  <div class="login-box">

    <div class="login-logo">
      <div class="brand-mark">Lu<span>la</span></div>
      <div class="login-tagline">Smart business tools for South African shops</div>
    </div>

    <!-- Google One Tap initialiser -->
    <div
      id="g_id_onload"
      data-client_id="790839446499-2q8ir0ttrcs7jf3v00uls48bc3m3q3s2.apps.googleusercontent.com"
      data-callback="handleGoogleSignIn"
      data-auto_prompt="false">
    </div>

    <!-- Rendered Google button (official widget) -->
    <div
      class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="continue_with"
      data-size="large"
      data-logo_alignment="left"
      data-width="340">
    </div>

    <div class="divider">or</div>

    <!-- Email/password fallback -->
    <div class="input-group">
      <label>Phone number or email</label>
      <input type="text" placeholder="e.g. 0821234567 or mama@spaza.co.za" />
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" placeholder="Enter your password" />
    </div>

    <button class="btn btn-primary btn-full" onclick="window.location.href='setup.html'">
      Sign in
    </button>

    <p style="text-align:center; margin-top:18px; font-size:13px; color:var(--muted);">
      Don't have an account?
      <a href="setup.html" style="color:var(--green); font-weight:500;">Get started free →</a>
    </p>

    <!-- Feature highlights -->
    <div style="margin-top:32px; padding-top:24px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted);">
        <span style="font-size:16px;">📶</span> Works without internet — syncs when back online
      </div>
      <div style="display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted);">
        <span style="font-size:16px;">💰</span> 80% less data — built for expensive South African data
      </div>
      <div style="display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted);">
        <span style="font-size:16px;">🏪</span> Built for spaza shops, taverns, salons & more
      </div>
    </div>
  </div>
</div>

<script>
  function handleGoogleSignIn(response) {
    try {
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      localStorage.setItem('lula_user', JSON.stringify({
        name:        payload.name,
        email:       payload.email,
        picture:     payload.picture,
        loginMethod: 'google'
      }));
      const hasSetup = localStorage.getItem('lula_setup_done');
      window.location.href = hasSetup ? 'dashboard.html' : 'setup.html';
    } catch(e) {
      alert('Sign-in failed. Please try again.');
    }
  }

  // Only auto-redirect if NOT coming from a sign-out
  const justSignedOut = sessionStorage.getItem('signed_out');
  if (!justSignedOut && localStorage.getItem('lula_user') && localStorage.getItem('lula_setup_done')) {
    window.location.href = 'dashboard.html';
  }
  sessionStorage.removeItem('signed_out');
</script>

</body>
</html>
